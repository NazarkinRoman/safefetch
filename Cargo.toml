[package]
authors     = ["DarkSky <darksky2048@gmail.com>"]
description = "A safe minimal fetching library."
edition     = "2024"
keywords    = ["fetch", "http", "https", "client", "server"]
license     = "AGPL-3.0-only"
name        = "safefetch"
readme      = "README.md"
repository  = "https://github.com/darkskygit/safefetch"
version     = "0.1.0"

[dependencies]
anyhow = "1.0"
hickory-resolver = { version = "0.26", features = [
  "https-aws-lc-rs",
  "tokio",
  "webpki-roots",
] }
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "webp",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
] }
rustls = "0.23"
tokio = { version = "1.52", features = ["rt"] }
url = "2.5"
webpki-roots = "1"

[dev-dependencies]
base64-simd = "0.8"
